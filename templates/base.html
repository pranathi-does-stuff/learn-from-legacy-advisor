<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Legacy Career &amp; Academic Advisory &bull; Interactive Council{% endblock %}</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='133') }}" />
    {% block head %}{% endblock %}
</head>

<body>
    <div class="page-wrapper {% block page_wrapper_class %}{% endblock %}">
        <!-- Hidden Audio Element for reliable playback across pages -->
        <audio id="advisor-audio-element" preload="auto" hidden></audio>

        <!-- Site Header & Progress Navigation -->
        <header class="site-header">
            <div class="header-brand">
                <a href="/" class="brand-link">
                    <div class="brand-mark" aria-hidden="true"></div>
                    <span class="brand-title">Legacy Academic &amp; Career Advisory</span>
                </a>
            </div>
            <div id="wizard-progress" class="wizard-progress">
                <span id="progress-label" class="progress-label">{% block progress_label %}Section 1 of 5 &bull;
                    Foundations{% endblock %}</span>
                <div class="progress-track" aria-hidden="true">
                    <div id="progress-fill" class="progress-fill"
                        data-progress="{% block progress_percent %}20%{% endblock %}"></div>
                    <span class="progress-segment"></span><span class="progress-segment"></span>
                    <span class="progress-segment"></span><span class="progress-segment"></span>
                    <span class="progress-segment"></span>
                </div>
            </div>
        </header>

        <main class="main-container">
            <section class="advisory-card" aria-live="polite">
                {% block content %}{% endblock %}
            </section>
        </main>

        <footer class="site-footer">
            <span>Personalized academic and career guidance for students</span>
        </footer>
    </div>

    <!-- Core Cross-Page Quiz State & Voice Handler -->
    <script src="{{ url_for('static', filename='js/quiz_state.js', v='135') }}"></script>
    <script>
        (function () {
            var pf = document.getElementById('progress-fill');
            if (pf) {
                var pVal = pf.getAttribute('data-progress');
                if (pVal) {
                    pf.style.width = pVal;
                }
            }

            var homeLink = document.querySelector('.brand-link');
            if (homeLink) {
                homeLink.addEventListener('click', function (event) {
                    event.preventDefault();
                    QuizApp.clearCurrentUserData();
                    QuizApp.navigateWithTransition(homeLink.href);
                });
            }

            document.addEventListener('click', function (event) {
                var link = event.target.closest('a[href]');
                if (!link || link.classList.contains('brand-link') || event.defaultPrevented ||
                    event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
                    link.target || link.hasAttribute('download')) return;
                var destination = new URL(link.href, window.location.href);
                if (destination.origin !== window.location.origin ||
                    (destination.pathname === window.location.pathname && destination.hash)) return;
                event.preventDefault();
                QuizApp.navigateWithTransition(destination.href);
            });

            requestAnimationFrame(function () {
                document.querySelector('.page-wrapper')?.classList.add('page-ready');
            });
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
